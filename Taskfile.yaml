version: "3"

dotenv: [".env"]

env:
  SOPS_AGE_KEY_FILE: "{{.ROOT_DIR}}/.age-key.txt"

vars:
  MIGRATIONS: migrations
  ENV_DIRS: . infra/auth0 infra/github

tasks:
  server: go run ./cmd/server
  cli: go run ./cmd/cli {{.CLI_ARGS}}

  test:coverage:
    cmds:
      - go test ./... -race -coverpkg=./... -coverprofile=raw_coverage.out
      - grep -vE '/(actortest|accounttest)/' raw_coverage.out > coverage.out

  fmt: golangci-lint fmt
  lint: golangci-lint run

  openapi:
    cmds:
      - go run ./cmd/server openapi > api/openapi.yaml
      - go tool oapi-codegen -config oapi-codegen.yaml api/openapi.yaml

  db:lint: squawk '{{.MIGRATIONS}}/*.sql'
  db:sqlc:
    - sqlc generate -f sqlc.yaml
    - sqlc vet -f sqlc.yaml
  db:schema: ./scripts/db-schema.sh
  db:up: go run ./cmd/server migrate
  db:*:
    desc: task db:status | db:down | db:create -- add_foo sql
    env:
      GOOSE_DRIVER: postgres
      GOOSE_MIGRATION_DIR: "{{.MIGRATIONS}}"
      GOOSE_DBSTRING: "{{.DATABASE_URL}}"
    cmd: goose -s {{index .MATCH 0}} {{.CLI_ARGS}}

  env:decrypt:
    cmds:
      - for: { var: ENV_DIRS }
        cmd: sops decrypt --input-type dotenv --output-type dotenv --output {{.ITEM}}/.env {{.ITEM}}/.env.enc
  env:encrypt:
    cmd: ./scripts/env-encrypt.sh {{.ENV_DIRS}}

  auth:env:
    desc: Copy Terraform outputs (issuer, audience, web client) into the backend .env
    cmds:
      - ./scripts/auth-env.sh
      - task: env:encrypt
