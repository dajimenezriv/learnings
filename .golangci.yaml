version: "2"

linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - exhaustruct_v5
    - gomodguard
    - ireturn
    - lll
    - nlreturn
    - noinlineerr
    - paralleltest
    - tagalign
    - testpackage
    - varnamelen
    - wsl
    - wsl_v5

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    sloglint:
      context: scope
    gocritic:
      enable-all: true
      disabled-checks:
        - hugeParam
        - unnamedResult
    govet:
      enable-all: true
      disable:
        - fieldalignment
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    generated: strict
    warn-unused: true
    presets:
      - comments
    rules:
      - path: (_test\.go$|test/|testhelpers/)
        linters:
          - containedctx
          - funlen
          - gochecknoglobals
          - goconst
          - mnd
          - wrapcheck

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: exercise
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - exercise

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
